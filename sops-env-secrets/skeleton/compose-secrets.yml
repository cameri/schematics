# Skeleton: compose-secrets.yml
#
# The wiring that mounts a SOPS dotenv file and the service's dedicated age key
# read-only, and starts the application under `sops exec-env`.
#
# Secret NAMES are prefixed with the service name on purpose: when several
# compose files are merged into one project (`include:`), secrets share one
# flat namespace, so a generic name like `age-keys` silently binds another
# service's key file. See ../modules/env-secrets.md.

services:
  myservice:
    image: myorg/myservice:1.4.2

    # Decrypt in memory, then exec the app. No `--` separator before the
    # command: `sops exec-env` treats everything after the file as the command.
    command:
      - sh
      - -c
      - exec sops exec-env /run/secrets/secrets.env python -m myservice

    # sops reads the private key from this path inside the container.
    environment:
      - SOPS_AGE_KEY_FILE=/run/secrets/age-keys

    secrets:
      # The encrypted dotenv store. The TARGET NAME MUST END IN .env:
      # `sops exec-env` infers the dotenv format from the file extension.
      - source: myservice-env-encrypted
        target: secrets.env
      # The dedicated key for THIS service only. Never the master key.
      - source: myservice-age-keys
        target: age-keys

secrets:
  myservice-env-encrypted:
    file: ./.env.encrypted
  myservice-age-keys:
    # KEY_DIR default is $HOME/sops/age (parameter P-1).
    file: ${KEY_DIR:-/home/you/sops/age}/myservice-keys.txt


# ---------------------------------------------------------------------------
# Distroless / no-shell variant
# ---------------------------------------------------------------------------
# When the image is based on the sops image itself (Containerfile variant B),
# the entrypoint already contains the wrapper and no `command:` override is
# needed, keep only `environment` and `secrets` above. If the image's
# entrypoint is empty, set it here instead of `command:`:
#
#     entrypoint:
#       - sh
#       - -c
#       - exec sops exec-env /run/secrets/secrets.env ${APP_CMD}
#
# and give the app command through `environment: [APP_CMD=...]`.
