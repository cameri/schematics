# Skeleton: compose-socket-proxy.yml
#
# The proxy service plus its internal network, ready to drop into an
# existing compose project. Deny-by-default: enable groups only with a
# written justification (R-3).

services:
  socket-proxy:
    # Digest-pinned (R-4). Update by replacing the digest after review.
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      # The pinned image sets EVENTS, PING and VERSION to 1 in its own ENV, so
      # leaving them out still allows GET /events, GET /_ping and GET /version.
      # Pin them off for the effective policy to be what this file says (R-2);
      # see modules/endpoint-scoping.md.
      EVENTS: 0      # no consumer watches the daemon event stream
      PING: 0        # no consumer probes /_ping
      VERSION: 0     # nothing reads the daemon version
      # Enable groups ONLY as consumers require them, each with a
      # justification (see modules/endpoint-scoping.md). Example of a
      # pull-only pipeline:
      # IMAGES: 1      # POST /images/create (pull), GET /images (exists?)
      # CONTAINERS: 1  # GET /containers/json (status)
      # POST: 1        # the POST verb; start/stop/restart stay off
    volumes:
      # Read-only mount (R-6). P-2 if the socket lives elsewhere.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
      # Only if a consumer needs P-7 (network_mode: host can't resolve
      # this service by name — see the host-network-consumers module),
      # replace the line above with the mapping form so the proxy gets
      # a fixed address inside the subnet below:
      # docker-proxy:
      #   ipv4_address: 172.30.0.2
    # No ports: block (R-5). Nothing may be published for this service.

networks:
  docker-proxy:
    driver: bridge
    # internal: true additionally blocks outbound masquerading if the
    # proxy never needs egress; drop it if a consumer network requires
    # routed egress on the same network.
    internal: true
    # Only needed alongside P-7 above: ipv4_address requires the network
    # to have a fixed subnet — Docker rejects a static address on an
    # auto-assigned one. Pick a subnet that doesn't collide with any
    # existing network on the host before uncommenting:
    # `docker network inspect $(docker network ls -q) | grep Subnet`
    # ipam:
    #   config:
    #     - subnet: 172.30.0.0/24
