[req]
distinguished_name = req_distinguished_name
req_extensions = req_ext
x509_extensions = req_ext
prompt = no

[req_distinguished_name]
CN = Docker Server

[req_ext]
subjectAltName = @san
# The daemon's certificate must be usable as a server certificate: Docker's
# own TLS documentation sets this extension on the server certificate, and a
# certificate that carries no extended key usage is not restricted to it.
extendedKeyUsage = serverAuth

[san]
DNS.1 = localhost
IP.1 = 127.0.0.1
IP.2 = DOCKER_HOST_IP