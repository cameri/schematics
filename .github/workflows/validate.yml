name: validate

on:
  pull_request:
  push:
    branches: [main]

# The validator runs code from the pull request's checkout, so the job gets a
# read-only token and no persisted credentials: nothing in it can push.
permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin verification resolves commits in the repository's own history.
          fetch-depth: 0
          persist-credentials: false
      - name: Validate catalog, specs, and dependency pins
        env:
          # The updated-bump rule compares a pull request against its base
          # branch. A push to main has no base branch, and github.base_ref is
          # empty there, so the rule skips itself.
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/validate-catalog.sh
      - name: Render the catalog page against both catalogues
        # The catalogue is data the page reads at runtime, so nothing in the
        # validator above would notice a page that stops following it: the site
        # fails soft and shows "No schematics published yet." rather than
        # erroring. This renders the real page and counts the cards a reader
        # sees, on both hosts, including when the optional plugin fetch stalls.
        run: node scripts/check-site-render.js
