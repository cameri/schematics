name: Deploy Pages preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: preview/${{ github.event.pull_request.number }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate catalog
        run: ./scripts/validate-catalog.sh
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo IS the site (same as the prod deploy-pages.yml).
          path: "."
      - name: Deploy to GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Pages preview deployed: ${{ steps.deployment.outputs.page_url }}'
            })
  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview environment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const env = `preview/${context.issue.number}`
            try {
              await github.rest.repos.deleteAnEnvironment({ owner, repo, environment_name: env })
              console.log(`deleted environment ${env}`)
            } catch (e) {
              // Non-fatal: the Pages artifact is keyed to the environment and
              // GitHub deactivates the deployment on close; deletion may be
              // blocked by token scope (needs admin). Preview link stops being
              // updated either way.
              console.log(`notice: could not delete environment ${env}: ${e.message}`)
            }